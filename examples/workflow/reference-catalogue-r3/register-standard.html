/* Instrument — design tokens. A Standards pack, from Applied Form.
   Technical modernism. Import this stylesheet and wrap each Instrument surface
   in [data-standards-pack="instrument"]. Tokens never enter the host root. */
[data-standards-pack="instrument"]{
  /* palette — five colours, no sixth */
  --ground:#FFFFFF;
  --ink:#111111;
  --rule:#D8D8D8;
  --muted:#6B6B6B;
  --signal:#C8102E;   /* identification, one emphasis, or interaction — never a data series */

  /* type */
  --font-text:"Public Sans", system-ui, sans-serif;   /* everything textual */
  --font-data:"DM Mono", ui-monospace, monospace;     /* every numeral, unit, ID, label */

  /* system */
  --unit:8px; --gutter:24px; --cols:12; --measure:66ch;
  --band:32px;        /* 4 base units; 24px on 1:1 formats */
  --radius:0;         /* never rounded */
  --focus:#C8102E;

  /* scale — nothing off it */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px; --s7:96px;
}

/* Chromium rounds fractional borders, so the Schedule uses a measured,
   empty table row for its exact 1.5px header rule. */
[data-standards-pack="instrument"] .instrument-schedule .instrument-schedule-header-rule,
[data-standards-pack="instrument"] .instrument-schedule .instrument-schedule-header-rule td{
  height:1.5px;padding:0;background:var(--ink)
}

[data-standards-pack="instrument"] .instrument-matrix{
  table-layout:fixed
}
[data-standards-pack="instrument"] .instrument-matrix th,
[data-standards-pack="instrument"] .instrument-matrix td{
  overflow-wrap:normal;
  word-break:normal
}

/* Preserve readable table facts when a Schedule reaches a narrow handset. */
@media (max-width:639px){
  [data-standards-pack="instrument"] .instrument-matrix{display:block;table-layout:auto}
  [data-standards-pack="instrument"] .instrument-matrix thead,
  [data-standards-pack="instrument"] .instrument-matrix tbody{display:block}
